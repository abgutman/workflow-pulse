name: Canary dispatch test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt one dispatch with verbose error
        env:
          PULSE_PAT: ${{ secrets.PULSE_PAT }}
        run: |
          echo "token length: ${#PULSE_PAT}"
          code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $PULSE_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/abgutman/av-tools/actions/workflows/ccp-typewatch.yml/dispatches \
            -d '{"ref":"main"}')
          echo "HTTP $code"
          cat /tmp/resp
